<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; base-uri 'self'; form-action 'self';" />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <title>AURA — At your service</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="logo">🌌</span>
        <div>
          <h1>AURA</h1>
          <p class="tagline">Online · Knowledge · Sync</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="btnWipe" class="icon-btn" title="پاک‌سازی کامل">🧹</button>
        <button type="button" id="btnSettings" class="icon-btn" title="تنظیمات">⚙️</button>
        <button type="button" id="btnClear" class="icon-btn" title="پاک کردن چت">🗑️</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <footer class="composer">
      <button type="button" id="btnMic" class="fab mic" title="صدا">🎙️</button>
      <textarea id="input" rows="1" placeholder="جستجو · دانش · همگام‌سازی با اندروید..." dir="auto"></textarea>
      <button type="button" id="btnSend" class="fab send" title="ارسال">➤</button>
    </footer>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h2>تنظیمات امن</h2>
      <label>API Key
        <input type="password" id="cfgKey" autocomplete="off" placeholder="کلید شما" />
      </label>
      <label>Base URL (فقط https)
        <input type="text" id="cfgBase" placeholder="https://api.x.ai/v1" />
      </label>
      <label>Model
        <input type="text" id="cfgModel" placeholder="grok-4.7" />
      </label>
      <p class="hint">کلید فقط روی همین مرورگر ذخیره می‌شود. هرگز در چت عمومی نفرستید.</p>
      <div class="modal-actions">
        <button type="button" id="btnSaveCfg" class="primary">ذخیره</button>
        <button type="button" id="btnCloseCfg" class="ghost">بستن</button>
      </div>
    </div>
  </div>

  <div id="wipeModal" class="modal hidden">
    <div class="modal-card">
      <h2>پاک‌سازی کامل</h2>
      <p class="hint">کلید API، تنظیمات و تاریخچه چت از این مرورگر حذف می‌شود. ادامه؟</p>
      <div class="modal-actions">
        <button type="button" id="btnConfirmWipe" class="primary danger">بله، همه را پاک کن</button>
        <button type="button" id="btnCancelWipe" class="ghost">انصراف</button>
      </div>
    </div>
  </div>

  <script src="knowledge.js"></script>
  <script src="trading.js"></script>
  <script src="app.js"></script>
</body>
</html>
