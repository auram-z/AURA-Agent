<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AURA — At your service</title>
  <meta name="description" content="AURA personal AI agent — Jarvis-inspired web client" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>\ud83c\udf0c</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="logo">\ud83c\udf0c</span>
        <div>
          <h1>AURA</h1>
          <p class="tagline">At your service</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="btnSettings" class="icon-btn" title="\u062a\u0646\u0638\u06cc\u0645\u0627\u062a">\u2699\ufe0f</button>
        <button type="button" id="btnClear" class="icon-btn" title="\u067e\u0627\u06a9 \u06a9\u0631\u062f\u0646 \u0686\u062a">\ud83d\uddd1\ufe0f</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <footer class="composer">
      <button type="button" id="btnMic" class="fab mic" title="\u0635\u062f\u0627">\ud83c\udf99\ufe0f</button>
      <textarea id="input" rows="1" placeholder="\u0628\u0627 AURA \u0635\u062d\u0628\u062a \u06a9\u0646\u06cc\u062f..." dir="auto"></textarea>
      <button type="button" id="btnSend" class="fab send" title="\u0627\u0631\u0633\u0627\u0644">\u27a4</button>
    </footer>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h2>\u062a\u0646\u0638\u06cc\u0645\u0627\u062a API</h2>
      <label>API Key
        <input type="password" id="cfgKey" autocomplete="off" placeholder="xai-... \u06cc\u0627 sk-..." />
      </label>
      <label>Base URL
        <input type="text" id="cfgBase" placeholder="https://api.x.ai/v1" />
      </label>
      <label>Model
        <input type="text" id="cfgModel" placeholder="grok-beta" />
      </label>
      <p class="hint">\u06a9\u0644\u06cc\u062f \u0641\u0642\u0637 \u062f\u0631 \u0645\u0631\u0648\u0631\u06af\u0631 \u0634\u0645\u0627 (localStorage) \u0630\u062e\u06cc\u0631\u0647 \u0645\u06cc\u200c\u0634\u0648\u062f.</p>
      <div class="modal-actions">
        <button type="button" id="btnSaveCfg" class="primary">\u0630\u062e\u06cc\u0631\u0647</button>
        <button type="button" id="btnCloseCfg" class="ghost">\u0628\u0633\u062a\u0646</button>
      </div>
    </div>
  </div>

  <script src="trading.js"></script>
  <script src="app.js"></script>
</body>
</html>
